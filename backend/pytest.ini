# ============================================================
# BudgetBuddy — pytest configuration
# ============================================================
# All tests use the FastAPI TestClient with a dedicated
# SQLite test database (budget_buddy_test.db).
# The live PostgreSQL database (personal_budget_db) is NEVER
# touched by any test run.
# ============================================================

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
